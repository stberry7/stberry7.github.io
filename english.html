<script>
/* SHOW/HIDE 버튼: 전체 설명을 한 번에 숨기기/보이기 (개별 단어 클릭은 그대로 유지) */
window.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('toggle-button');
    const explanationNodes = Array.from(document.querySelectorAll('.term + p'));
    const termNodes = Array.from(document.querySelectorAll('.term'));

    if (!toggleBtn) return;

    // 초기 상태: 기본은 '모두 보임'으로 가정
    let allHidden = false;

    function anyVisible() {
        return explanationNodes.some(p => p && p.style.display !== 'none' && getComputedStyle(p).display !== 'none');
    }

    function hideAll() {
        explanationNodes.forEach(p => {
            if (p) p.style.display = 'none';
        });
        allHidden = true;
        toggleBtn.textContent = 'SHOW';
    }

    function showAll() {
        explanationNodes.forEach(p => {
            if (p) p.style.display = 'block';
        });
        allHidden = false;
        toggleBtn.textContent = 'HIDE';
    }

    // 버튼 클릭: 무조건 "전체"를 숨기거나 "전체"를 보여주기
    toggleBtn.addEventListener('click', function () {
        if (allHidden) {
            showAll();
        } else {
            hideAll();
        }
    });

    // 개별 단어 클릭: (1) 이미 열려 있으면 닫기 / (2) 닫혀 있으면 '그 단어만' 열기
    termNodes.forEach(term => {
        term.addEventListener('click', function () {
            const p = term.nextElementSibling;
            if (!p || p.tagName.toLowerCase() !== 'p') return;

            const isVisible = (p.style.display !== 'none' && getComputedStyle(p).display !== 'none');

            if (isVisible) {
                // 열려 있던 걸 닫기
                p.style.display = 'none';

                // 이제 정말로 전부 숨겨졌으면 버튼 상태도 맞춰줌
                if (!anyVisible()) {
                    allHidden = true;
                    toggleBtn.textContent = 'SHOW';
                }
            } else {
                // 닫혀 있던 걸 열 때는 '이것만' 열기
                hideAll();
                p.style.display = 'block';

                allHidden = false;
                toggleBtn.textContent = 'HIDE';
            }
        });
    });

    // 혹시 HTML에서 이미 <p>가 inline style로 숨겨져 시작하는 경우가 있으면 상태 동기화
    // (처음부터 전부 숨겨져 있으면 버튼을 SHOW로)
    if (!anyVisible()) {
        allHidden = true;
        toggleBtn.textContent = 'SHOW';
    } else {
        toggleBtn.textContent = 'HIDE';
    }
});
</script>

  function extractLine(block, label) {
    const re = new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*(.+)");
    const m = block.match(re);
    return m ? (m[1] || "").trim() : "";
  }

  function buildPronMap() {
    TERM_PRON.clear();
    for (const t of TERMS_DATA) {
      const raw = t && t.html ? String(t.html) : "";
      const ko = extractLine(raw, "발음(한글):");
      const stress = extractLine(raw, "강세:");
      const ipa = extractLine(raw, "발음기호:");
      const key = (t.term || "").toLowerCase().trim();
      if (!key) continue;
      if (ko || stress || ipa) TERM_PRON.set(key, { ko, stress, ipa });
    }
  }

  function isHardSynToken(token) {
    const s = String(token || "").trim();
    if (!s) return false;
    // only show for single words or hyphenated words (avoid long multi-word phrases)
    if (s.includes(" ")) return false;
    if (s.length >= 8) return true;
    if (s.includes("-")) return true;
    return false;
  }

  function enrichBoldWithPron(markdownText) {
    // If **token** matches an existing term and looks "hard", append (한글 · IPA · 강세)
    return String(markdownText || "").replace(/\*\*([^*]+)\*\*/g, (m, p1) => {
      const token = (p1 || "").trim();
      const key = token.toLowerCase();
      if (!TERM_PRON.has(key) && !AUTO_SYNONYM_PRON[key]) return m;
      if (!isHardSynToken(token) && !AUTO_SYNONYM_PRON[key]) return m;
      const pr = TERM_PRON.get(key) || AUTO_SYNONYM_PRON[key] || {};
      const ko = pr.ko || "";
      const ipa = pr.ipa || "";
      const stress = pr.stress || "";
      const parts = [];
      if (ko) parts.push(ko);
      if (ipa) parts.push(`<code>${ipa}</code>`);
      if (stress) parts.push(stress);
      if (!parts.length) return m;
      return `**${token}** <span class="syn-pron">(${parts.join(" · ")})</span>`;
    });
  }


(function(){

  function stripLeadingTermLine(raw, term){
    if(!raw) return raw;
    const t = (term || '').trim();
    if(!t) return raw;
    let s = String(raw).replace(/^\s+/, '');
    if(s.toLowerCase().startsWith(t.toLowerCase())){
      const rest = s.slice(t.length);
      if(/^\r?\n/.test(rest)){
        return rest.replace(/^\r?\n+/, '');
      }
    }
    return raw;
  }

  function stripHighlightSpans(s){
    return String(s).replace(/<span\s+class=["']highlight["']>([\s\S]*?)<\/span>/gi, '$1');
  }

  function keepHighlightOnlyInMeaning(raw){
    if(!raw) return raw;

    // If there is already a "Meaning/의미" line, keep highlights ONLY there.
    const hasMeaningLabel = /(의미\s*\(뜻\)\s*:|Meaning\s*\(뜻\)\s*:)/i.test(raw);
    if(hasMeaningLabel){
      const lines = String(raw).split('\n');
      return lines
        .map(line => ((/(의미\s*\(뜻\)\s*:|Meaning\s*\(뜻\)\s*:)/i.test(line)) ? line : stripHighlightSpans(line)))
        .join('\n');
    }

    // Otherwise, if there is a highlight somewhere, move it into a new meaning line.
    const m = String(raw).match(/<span\s+class=["']highlight["']>([\s\S]*?)<\/span>/i);
    const first = m ? m[1] : '';
    let stripped = stripHighlightSpans(raw);

    if(first && !/(의미\s*\(뜻\)\s*:|Meaning\s*\(뜻\)\s*:)/i.test(stripped)){
      // Insert meaning line after the pronunciation-symbol line if possible
      const mm = stripped.match(/발음기호\s*:[^\n]*\n/);
      if(mm){
        const pos = stripped.indexOf(mm[0]) + mm[0].length;
        stripped = stripped.slice(0, pos) + `의미(뜻): <span class="highlight">${first}</span>\n` + stripped.slice(pos);
      }else{
        stripped = `의미(뜻): <span class="highlight">${first}</span>\n\n` + stripped;
      }
    }

    return stripped;
  }

function formatTermHtml(t){

function render(terms){

      if(!byLetter.has(L)) byLetter.set(L, []);
      byLetter.get(L).push(t);
    });

    // '#' first if needed, then A-Z
    const order = [];
    if(byLetter.has('#')) order.push('#');
    for(let i=65;i<=90;i++){

      const divider = document.createElement('div');

  function validate(terms){
    const banner = document.getElementById('validator-banner');
    const issues = [];

    // duplicate term names (case-insensitive)
    const seen = new Map();
    terms.forEach(t=>{
      const k = (t.term || '').trim().toLowerCase();
      if(!k) return;
      seen.set(k, (seen.get(k)||0)+1);
    });
    const dups = Array.from(seen.entries()).filter(([k,v])=>v>1).map(([k,v])=>`${k} (${v})`);
    if(dups.length) issues.push(`중복 term 감지: ${dups.slice(0,8).join(', ')}${dups.length>8?' ...':''}`);

    // missing descriptions
    const missingDesc = terms.filter(t => !String(t.html||'').trim()).length;
    if(missingDesc) issues.push(`설명(p) 비어있는 항목: ${missingDesc}개`);

    // DOM count check
    const domCount = document.querySelectorAll('span.term').length;
    if(domCount !== terms.length) issues.push(`DOM term 개수 불일치: data=${terms.length}, dom=${domCount}`);

    if(issues.length){
      console.warn('[terms] validation issues:', issues);
      if(banner){
        banner.style.display = 'block';
        banner.textContent = '⚠️ 점검 경고: ' + issues.join(' | ');
      }
    }else{
      console.log('[terms] validation OK. total=', terms.length);
      if(banner) banner.style.display = 'none';
    }
  }

  function setupFilters(){
    const dateFilter = document.getElementById('date-filter');
    const qInput = document.getElementById('term-search');
    const inDesc = document.getElementById('search-in-desc');

    
    // --- highlight helpers ---
    function escapeRegExp(s){
      return (s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function clearHighlights(root){
      if(!root) return;
      const marks = root.querySelectorAll('span.search-hit');
      marks.forEach(m=>{
        const parent = m.parentNode;
        if(!parent) return;
        parent.replaceChild(document.createTextNode(m.textContent || ''), m);
        parent.normalize();
      });
    }
    function highlightText(root, q){
      if(!root || !q) return;
      const re = new RegExp(escapeRegExp(q), 'ig');
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node){
          if(!node || !node.nodeValue) return NodeFilter.FILTER_REJECT;
          if(!re.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
          // skip if inside already-highlighted span
          if(node.parentElement && node.parentElement.closest && node.parentElement.closest('span.search-hit')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      const nodes = [];
      while(walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node=>{
        const text = node.nodeValue;
        const frag = document.createDocumentFragment();
        let last = 0;
        text.replace(re, (match, offset)=>{
          const before = text.slice(last, offset);
          if(before) frag.appendChild(document.createTextNode(before));
          const span = document.createElement('span');
          span.className = 'search-hit';
          span.textContent = match;
          frag.appendChild(span);
          last = offset + match.length;
          return match;
        });
        const after = text.slice(last);
        if(after) frag.appendChild(document.createTextNode(after));
        node.parentNode.replaceChild(frag, node);
      });
    }

    // debounce to keep it smooth on large pages
    let _applyTimer = null;
    function scheduleApply(){
      if(_applyTimer) clearTimeout(_applyTimer);
      _applyTimer = setTimeout(apply, 40);
    }

function apply(){
      const dateVal = dateFilter ? (dateFilter.value || '').trim() : '';
      const q = qInput ? (qInput.value || '').toLowerCase().trim() : '';

      const lis = Array.from(document.querySelectorAll('#terms-list > li'));
      lis.forEach(li=>{
        const sp = li.querySelector('.term');
        const term = sp ? (sp.textContent || '').toLowerCase().trim() : '';
        const itemDate = sp ? (sp.dataset.date || '') : '';

        const passDate = !dateVal ? true : (itemDate === dateVal);
        let passSearch = true;
        if(q){
          const useDesc = inDesc && inDesc.checked;
          if(!useDesc){
            passSearch = term.startsWith(q);
          }else{
            // 단어 제목은 prefix 우선, 설명은 포함 검색(너무 과도한 매칭 방지 위해 q>=2일 때만)

            const p = li.querySelector('p');
            const desc = p ? (p.textContent || '').toLowerCase() : '';
            const descMatch = (q.length >= 2) ? desc.includes(q) : false;

        li.style.display = (passDate && passSearch) ? 'block' : 'none';
      });

      
      // --- highlight (only when '설명도 함께 검색' is ON, and query length >= 2) ---
      const listRoot = document.getElementById('terms-list');
      clearHighlights(listRoot);

      if(inDesc && inDesc.checked && q && q.length >= 2){
        const visibleLis = Array.from(document.querySelectorAll('#terms-list > li'))
          .filter(li => li.style.display !== 'none');
        visibleLis.forEach(li=>{
          const p = li.querySelector('p');
          if(p) highlightText(p, q);
        });
      }
// divider show/hide: if searching, hide empty letters; otherwise show all
      const divs = Array.from(document.querySelectorAll('#terms-list > .alpha-divider'));
      if(!q){
        divs.forEach(d => d.style.display = '');
      }else{
        divs.forEach(d=>{
          let has = false;
          let n = d.nextElementSibling;
          while(n && !(n.classList && n.classList.contains('alpha-divider'))){
            if(n.tagName && n.tagName.toLowerCase()==='li' && n.style.display !== 'none'){
              has = true; break;
            }
            n = n.nextElementSibling;
          }
          d.style.display = has ? '' : 'none';
        });
      }
    }

    if(qInput) qInput.addEventListener('input', scheduleApply);
    if(inDesc) inDesc.addEventListener('change', apply);
    if(dateFilter) dateFilter.addEventListener('change', apply);

    // initial
    apply();
  }

  function setupAlphabetLinks(){
    const links = document.querySelectorAll('.alphabet-links a');
    links.forEach(a=>{
      a.addEventListener('click', function(e){
        e.preventDefault();
        const targetId = (this.getAttribute('href') || '').replace('#','');
        const el = document.getElementById(targetId);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function setupTermToggle(){
    // individual term click toggles its own <p>
    document.addEventListener('click', function(e){
      const sp = e.target && e.target.closest ? e.target.closest('.term') : null;
      if(!sp) return;
      const p = sp.parentElement ? sp.parentElement.querySelector('p') : null;
      if(!p) return;
      p.style.display = (p.style.display === 'none') ? '' : 'none';
    });

    // global button: hide all / show all (NOT invert each)
    const btn = document.getElementById('toggle-button');
    if(!btn) return;

    let allHidden = false;

    function setAll(hidden){
      const ps = document.querySelectorAll('#terms-list li > p');
      ps.forEach(p => { p.style.display = hidden ? 'none' : ''; });
      allHidden = hidden;
      btn.textContent = hidden ? 'SHOW' : 'HIDE';
    }

    // initial state: show all
    setAll(false);

    btn.addEventListener('click', function(e){
      e.preventDefault();
      setAll(!allHidden);
    });
  }

  function setupUrlJump(){
    // ?term=BUY_OFF or ?term=buy off 뜻
    const params = new URLSearchParams(window.location.search);
    const q = params.get('term');
    if(!q) return;

    const id = normQueryToId(q);
    if(!id) return;

    const el = document.getElementById(id);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.style.backgroundColor = '#f7f59e';
      setTimeout(()=>{ el.style.backgroundColor = ''; }, 2500);
    }
  }

  window.addEventListener('DOMContentLoaded', function(){
    const terms = readData();

    // 날짜 옵션은 data-date에서 자동 생성
    ensureDateOptions(terms);

    updateTotalCount(terms.length);

    // 렌더링 (A~Z 자동 배치 -> W/X 같은 문제 방지)
    render(terms);

    // 필터/검색/링크/토글/URL 이동 설정 (DOM이 만들어진 뒤)
    setupFilters();
    setupAlphabetLinks();
    setupTermToggle();
    setupUrlJump();

    // 검증(경고 배너/콘솔)
    validate(terms);
  });
})();
</script>

<script id="synonyms-blue-script">
window.addEventListener('DOMContentLoaded', function () {
  // "비슷한 표현:" 줄에서, 영어 표현(괄호 앞)만 파란색으로 표시
  var ps = document.querySelectorAll('li > p');
  ps.forEach(function(p){
    // 이미 처리된 경우 스킵
    if (p.querySelector('.syn-word')) return;
    var html = p.innerHTML;
    var marker = '비슷한 표현:';
    var idx = html.indexOf(marker);
    if (idx === -1) return;

    // marker 이후 내용을 끝까지(보통 마지막 줄) 처리
    var before = html.slice(0, idx + marker.length);
    var after = html.slice(idx + marker.length);

    // 줄바꿈 기준으로 첫 줄만(=비슷한 표현 리스트) 우선 처리
    // <br> 또는 
// (HTML에 따라) 모두 커버
    var split = after.split(/<br\s*\/?\s*>|\n/);
    var line = split[0];

    // 쉼표로 항목 분리
    var parts = line.split(',');
    var rebuilt = parts.map(function(part){
      var s = part;
      // 공백 정리
      s = s.replace(/^\s+|\s+$/g,'');
      if(!s) return '';
      // 괄호가 있으면 괄호 앞만 파란색
      var m = s.match(/^(.*?)(\([^)]*\))\s*$/);
      if (m){
        var w = m[1].trim();
        var rest = m[2];
        if(w) return '' + w + '' + rest;
        return s;
      } else {
        return '' + s + '';
      }
    }).filter(Boolean).join(', ');

    // 원본 after에서 line 부분만 교체
    split[0] = rebuilt;
    var after2 = split.join('\n');
    p.innerHTML = before + after2;
  });
});
</script>
